name: codefog CI & PR Evidence Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  codefog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & Test
        run: |
          npm run typecheck
          npm test

      - name: Build CLI
        run: npm run build

      - name: Run codefog PR Diff & Evidence Gate
        if: github.event_name == 'pull_request'
        run: |
          npx codefog --diff origin/${{ github.base_ref }} --pr-comment .codefog --fail-on returned
